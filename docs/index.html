<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Media Content Lab</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Mi Media Content Lab</h1>
    <nav id="tabs" hidden>
      <button data-tab="posts" class="tab on">Posts</button>
      <button data-tab="brand" class="tab">Brand</button>
      <button id="logout" class="tab">Log out</button>
    </nav>
  </header>

  <main>
    <!-- Log in -->
    <form id="setup" class="panel" hidden>
      <h2>Log in</h2>
      <label>Password <input id="login-pass" type="password" autocomplete="current-password"></label>
      <button id="login-go" class="primary wide">Log in</button>
      <p id="cfg-status" class="muted"></p>
    </form>

    <!-- Posts -->
    <section id="posts" hidden>
      <div class="panel">
        <div class="status-line">
          <span id="schedule-text" class="muted"></span>
          <label class="switch"><input type="checkbox" id="auto-toggle"><span>Auto-post</span></label>
        </div>
        <label>What should the post be about?
          <textarea id="new-topic" rows="2" placeholder="e.g. 5 mistakes new traders make — or leave empty for one of the brand topics"></textarea>
        </label>
        <label class="file">Your own photo (optional)
          <input id="new-photo" type="file" accept="image/*">
        </label>
        <button id="new-go" class="primary wide">Make post</button>
        <p class="muted small">Each action takes about a minute. You can close the page and come back.</p>
      </div>
      <div id="list" class="list"></div>
      <p id="empty" class="muted center" hidden>No posts yet. Make your first one above.</p>
    </section>

    <!-- Brand -->
    <section id="brand" class="panel" hidden>
      <h2>Brand look and voice</h2>
      <div class="logo-row">
        <img id="logo-img" alt="Current logo">
        <label class="file">Change logo (PNG, transparent background is best)
          <input id="logo-file" type="file" accept="image/png">
        </label>
      </div>
      <form id="brand-form"></form>
      <button id="brand-save" class="primary wide">Save brand</button>
    </section>
  </main>

  <div id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
