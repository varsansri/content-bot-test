name: bot
run-name: ${{ github.event_name == 'schedule' && 'schedule check' || format('{0} {1}', inputs.action, inputs.id) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "new | post | picture | text | caption | skip"
        required: true
        default: new
      id:
        description: Draft ID
        required: true
      topic:
        description: What the post is about (new only)
        default: ""
      caption:
        description: New caption (caption only)
        default: ""
      photo:
        description: Uploaded photo path on the drafts branch (new only)
        default: ""
      aspect:
        description: "Picture shape: 4:5 | 1:1 | 9:16 (new only)"
        default: ""
  schedule:
    - cron: "7,37 * * * *" # checks twice an hour whether a post_times slot is due

permissions:
  contents: write

concurrency:
  group: bot-${{ inputs.id || 'schedule' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the drafts
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" drafts > /dev/null; then
            git clone -q --depth 50 --branch drafts "$url" data
          else
            mkdir data && cd data && git init -q -b drafts && git remote add origin "$url"
          fi

      - name: Is a post due?
        id: due
        if: github.event_name == 'schedule'
        run: python3 run.py due >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        run: pip install -q -r requirements.txt

      - name: Do the work
        if: github.event_name != 'schedule' || steps.due.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          ACTION: ${{ inputs.action }}
          ID: ${{ inputs.id }}
          TOPIC: ${{ inputs.topic }}
          CAPTION: ${{ inputs.caption }}
          PHOTO: ${{ inputs.photo }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python run.py schedule; else python run.py action; fi

      - name: Save the drafts
        if: always()
        env:
          ACTION: ${{ inputs.action || 'schedule' }}
          ID: ${{ inputs.id }}
        run: |
          cd data
          git config user.name "content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "$ACTION $ID"
          for i in 1 2 3 4 5; do
            git push -q origin drafts && exit 0
            git pull -q --rebase origin drafts || true
            sleep $((i * 3))
          done
          exit 1
